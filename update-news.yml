name: Update NAVI CS2 news

on:
  schedule:
    - cron: '17 10 * * *' # щодня о 12:17 за Києвом взимку / 13:17 влітку
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch latest NAVI CS2 publications
        run: python scripts/update_news.py
      - name: Commit updated news
        run: |
          if git diff --quiet -- news.json; then
            echo "No news changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update NAVI CS2 news"
          git push
